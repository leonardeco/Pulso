<dialog #hoja class="selector" aria-labelledby="titulo-selector" (close)="alCerrar()" (click)="clicFondo($event)">
  <div class="selector-cabecera">
    <div class="selector-titulo">
      <h2 id="titulo-selector">Elegir ejercicio</h2>
      <button type="button" class="orden-boton selector-cerrar" aria-label="Cerrar" (click)="cerrar()">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5z" fill="currentColor" />
        </svg>
      </button>
    </div>
    <input
      #buscador
      type="search"
      enterkeyhint="search"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Buscar ejercicio"
      placeholder="Buscar ejercicio"
      [value]="consulta()"
      (input)="$event.stopPropagation(); escribir($event)"
      (keydown.enter)="enter($event)"
      (keydown.escape)="$event.preventDefault(); cerrar()"
    />
  </div>
  <div class="sr-only" role="status" aria-live="polite">{{ conteo() }}</div>
  <div #lista class="selector-lista">
    @let b = busqueda();
    @if (b.resultados.length > 0) {
      <ul class="selector-resultados">
        @for (resultado of b.resultados; track resultado.nombre) {
          <li>
            <button
              type="button"
              class="selector-opcion"
              [class.con-etiqueta]="resultado.origen === 'reciente'"
              (click)="elegir(resultado.nombre)"
            >
              {{ resultado.nombre }}
            </button>
            @if (resultado.origen === 'reciente') {
              <span class="selector-etiqueta">Reciente</span>
            }
          </li>
        }
      </ul>
    } @else if (b.crear) {
      <p class="vacio">Sin coincidencias.</p>
    }
    @if (b.crear; as crear) {
      <button type="button" class="selector-opcion selector-crear" (click)="elegir(crear)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z" fill="currentColor" />
        </svg>
        Crear «{{ crear }}»
      </button>
    }
  </div>
</dialog>
