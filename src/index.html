<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pulso Entrenadores</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" type="image/png" href="pulso-icono.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var tema = localStorage.getItem('pulso.tema') === 'claro' ? 'claro' : 'oscuro';
        document.documentElement.dataset.tema = tema;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', tema === 'oscuro' ? '#07090d' : '#f4f6fa');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
